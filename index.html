<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UWON 督学系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232E;
    --teal:#167F6C;
    --teal-dark:#0F6355;
    --teal-tint:#E4F4EF;
    --blue:#2E6FB0;
    --indigo:#223A63;
    --gold:#EFA23A;
    --coral:#E2632B;
    --bg:#F7FAF9;
    --line:#D8E6E1;
    --white:#FFFFFF;
    --muted:#6B7C82;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .petal-stripe{
    height:6px;
    width:100%;
    background:linear-gradient(90deg,#F2C94C 0%,#E8702A 26%,#2E6FB0 68%,#223A63 100%);
  }
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 28px;
    background:var(--white);
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand img{height:34px;width:auto;display:block;}
  .brand .sep{width:1px;height:22px;background:var(--line);}
  .brand .app-name{
    font-family:'Baloo 2',sans-serif;
    font-weight:600;
    font-size:17px;
    color:var(--indigo);
    letter-spacing:.2px;
  }
  header.top .right{
    display:flex;
    align-items:center;
    gap:14px;
    font-size:14px;
    color:var(--muted);
  }
  .btn-text{
    background:none;
    border:none;
    color:var(--teal);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    padding:6px 4px;
  }
  .btn-text:hover{color:var(--teal-dark);}

  .screen{display:none;}
  .screen.active{display:block;}

  /* ---------- Login ---------- */
  #screen-login.active{
    min-height:calc(100vh - 6px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%;
    max-width:380px;
    background:var(--white);
    border-radius:20px;
    padding:38px 34px 32px;
    box-shadow:0 20px 50px -18px rgba(22,35,46,.18);
    text-align:center;
  }
  .login-card img.logo-mark{height:118px;margin-bottom:6px;}
  .login-card h1{
    font-family:'Inter',system-ui,sans-serif;
    font-size:26px;
    font-weight:700;
    color:var(--indigo);
    margin:2px 0 4px;
  }
  .login-card p.tag{
    font-size:13px;
    color:var(--muted);
    margin:0 0 26px;
  }
  .field{
    text-align:left;
    margin-bottom:16px;
  }
  .field label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:11px 13px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:15px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    background:var(--bg);
    outline:none;
    transition:border-color .15s;
  }
  .field input:focus{border-color:var(--teal);}
  .btn-primary{
    width:100%;
    padding:12px 0;
    border-radius:10px;
    border:none;
    background:var(--teal);
    color:#fff;
    font-size:15px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    margin-top:6px;
    transition:background .15s;
  }
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-secondary{
    padding:12px 18px;
    border-radius:10px;
    border:1.5px solid var(--teal);
    background:#fff;
    color:var(--teal-dark);
    font-size:15px;
    font-weight:600;
    font-family:'Inter',sans-serif;
    cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .btn-secondary:hover{background:var(--teal-tint);}

  /* ---------- Print report (mirrors the long-image layout) ---------- */
  #print-report-root{ display:none; }
  #print-report-root .pr-stripe{
    height:6px;width:100%;margin-bottom:22px;
    background:linear-gradient(90deg,#F2C94C 0%,#E8702A 26%,#2E6FB0 68%,#223A63 100%);
  }
  #print-report-root .pr-header{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;
  }
  #print-report-root .pr-brand{ display:flex;align-items:center;gap:10px; }
  #print-report-root .pr-brand img{ height:36px;width:auto;display:block; }
  #print-report-root .pr-brand-name{
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;color:var(--indigo);
  }
  #print-report-root .pr-title-block{
    display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;
  }
  #print-report-root .pr-title{
    font-family:'Baloo 2',sans-serif;font-size:27px;font-weight:700;color:var(--indigo);margin:0;
  }
  #print-report-root .pr-date{ font-size:13.5px;color:var(--muted); }
  #print-report-root .pr-chips{ display:flex;flex-wrap:wrap;gap:10px;margin-bottom:24px; }
  #print-report-root .pr-chip{
    background:var(--teal-tint);color:var(--teal-dark);font-size:12.5px;font-weight:700;
    padding:7px 14px;border-radius:999px;
  }
  #print-report-root .pr-list{ display:flex;flex-direction:column;gap:16px; }
  #print-report-root .pr-item{
    border:1px solid var(--line);border-radius:14px;padding:18px 20px;
    page-break-inside:avoid;break-inside:avoid;
  }
  #print-report-root .pr-item-head{ display:flex;align-items:center;gap:12px;margin-bottom:10px; }
  #print-report-root .pr-item-num{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;
    background:var(--teal-tint);color:var(--teal-dark);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
  }
  #print-report-root .pr-item-title{ font-size:16px;font-weight:700;color:var(--ink);flex:1;min-width:0; }
  #print-report-root .pr-badge{
    font-size:11px;font-weight:700;padding:4px 12px;border-radius:999px;
    white-space:nowrap;flex-shrink:0;
  }
  #print-report-root .pr-badge.done{ background:var(--teal-tint);color:var(--teal-dark); }
  #print-report-root .pr-badge.pending{ background:#F0F0EC;color:var(--muted); }
  #print-report-root .pr-item-meta{ font-size:12.5px;color:var(--muted);margin:0 0 6px 38px; }
  #print-report-root .pr-item-note{ font-size:12.5px;color:var(--muted);margin:0 0 10px 38px;line-height:1.6; }
  #print-report-root .pr-item-images{ margin-left:38px;display:flex;flex-direction:column;gap:12px; }
  #print-report-root .pr-item-images img{
    width:100%;max-width:640px;height:auto;display:block;
    border-radius:12px;border:1px solid var(--line);
  }
  #print-report-root .pr-footer{ text-align:center;font-size:12px;color:var(--muted);margin-top:26px; }

  @media print{
    @page{ margin:14mm; }
    body *{ visibility:hidden; }
    #print-report-root, #print-report-root *{ visibility:visible; }
    #print-report-root{
      display:block;position:absolute;left:0;top:0;width:100%;padding:0;
    }
  }
  .error-msg{
    color:var(--coral);
    font-size:13.5px;
    font-weight:600;
    margin-top:12px;
    min-height:16px;
  }

  /* ---------- Dashboard ---------- */
  .page-wrap{
    max-width:920px;
    margin:0 auto;
    padding:40px 24px 60px;
  }
  .greet{
    font-family:'Baloo 2',sans-serif;
    font-size:24px;
    font-weight:600;
    color:var(--indigo);
    margin:0 0 6px;
  }
  .greet-sub{
    color:var(--muted);
    font-size:14px;
    margin:0 0 30px;
  }
  #screen-dashboard .page-wrap{
    text-align:center;
  }
  .tile-stack{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
  }
  .tile{
    background:linear-gradient(135deg,var(--teal) 0%, #1B9C84 60%, #21B092 100%);
    border-radius:20px;
    padding:32px 30px;
    color:#fff;
    cursor:pointer;
    max-width:480px;
    margin:0 auto;
    text-align:left;
    box-shadow:0 18px 40px -16px rgba(22,127,108,.45);
    transition:transform .15s, box-shadow .15s;
  }
  .tile:hover{transform:translateY(-2px);box-shadow:0 22px 46px -14px rgba(22,127,108,.5);}
  .tile .tile-title{
    font-family:'Baloo 2',sans-serif;
    font-size:19px;
    font-weight:600;
    margin:0 0 6px;
  }
  .tile .tile-sub{
    font-size:13.5px;
    opacity:.92;
    margin:0;
    line-height:1.5;
  }
  .more-hint{
    margin-top:18px;
    font-size:12.5px;
    color:var(--muted);
  }

  /* ---------- Planner ---------- */
  .planner-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:6px;
  }
  .planner-title{
    font-family:'Baloo 2',sans-serif;
    font-size:22px;
    font-weight:600;
    color:var(--indigo);
    margin:0;
  }
  .planner-date{
    font-size:13.5px;
    color:var(--muted);
  }
  .progress-line{
    font-size:13px;
    color:var(--teal-dark);
    font-weight:600;
    margin:4px 0 22px;
  }

  .plan-list{
    display:flex;
    flex-direction:column;
    gap:14px;
    max-width:620px;
  }
  .plan-row{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 20px;
  }
  .plan-row.row-done{ opacity:.55; }
  .plan-row.row-done .task-select,
  .plan-row.row-done .subject-select,
  .plan-row.row-done .homework-detail,
  .plan-row.row-done .other-text,
  .plan-row.row-done .note-field,
  .plan-row.row-done .fixed-task{
    text-decoration:line-through;
  }
  .row-head{
    display:flex;
    align-items:center;
    margin-bottom:14px;
  }
  .row-num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--teal-tint);
    color:var(--teal-dark);
    font-size:12.5px;
    font-weight:700;
  }
  .field-group{ margin-bottom:14px; }
  .field-group:last-child{ margin-bottom:0; }
  .add-row-card{
    border:1.5px dashed var(--line);
    border-radius:16px;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:var(--teal-dark);
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    background:transparent;
    transition:background .15s, border-color .15s;
  }
  .add-row-card:hover{ background:var(--teal-tint); border-color:var(--teal); }
  .add-row-card .plus-icon{ font-size:18px; line-height:1; }

  .report-meta{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin:6px 0 20px;
  }
  .report-chip{
    background:var(--teal-tint);
    color:var(--teal-dark);
    font-size:12.5px;
    font-weight:600;
    padding:7px 14px;
    border-radius:999px;
  }
  .report-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-width:620px;
  }
  .report-item{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 18px;
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .report-item.pending{ opacity:.75; }
  .report-item .item-num{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:24px;height:24px;
    border-radius:50%;
    background:var(--teal-tint);
    color:var(--teal-dark);
    font-size:12px;
    font-weight:700;
    flex-shrink:0;
    margin-top:1px;
  }
  .report-item .item-body{ flex:1; min-width:0; }
  .item-title-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .item-title{
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    word-break:break-word;
  }
  .status-badge{
    font-size:11.5px;
    font-weight:600;
    padding:3px 10px;
    border-radius:999px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .status-badge.done{ background:var(--teal-tint); color:var(--teal-dark); }
  .status-badge.pending{ background:#F0F0EC; color:var(--muted); }
  .item-meta{
    font-size:12.5px;
    color:var(--muted);
    margin-top:4px;
  }
  .item-note{
    font-size:12.5px;
    color:var(--muted);
    margin-top:6px;
    line-height:1.6;
  }
  .report-item-images{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:8px;
  }
  .report-item-images img{
    width:150px;
    height:150px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid var(--line);
  }
  .link-btn{
    display:inline-block;
    margin-top:8px;
    padding:8px 14px;
    background:var(--teal);
    color:#fff;
    font-size:13px;
    font-weight:600;
    border-radius:8px;
    text-decoration:none;
  }
  .link-btn:hover{ background:var(--teal-dark); }
  .upload-btn{
    display:inline-block;
    margin-top:8px;
    padding:7px 12px;
    border:1.5px dashed var(--line);
    border-radius:8px;
    font-size:12.5px;
    font-weight:600;
    color:var(--teal-dark);
    cursor:pointer;
    background:var(--bg);
  }
  .upload-btn:hover{ background:var(--teal-tint); border-color:var(--teal); }
  .note-images{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:8px;
  }
  .note-image-thumb{
    position:relative;
    width:64px;
    height:64px;
  }
  .note-image-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:8px;
    border:1px solid var(--line);
  }
  .remove-image-btn{
    position:absolute;
    top:-6px;
    right:-6px;
    width:18px;
    height:18px;
    border-radius:50%;
    border:none;
    background:var(--coral);
    color:#fff;
    font-size:12px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .task-files-list{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:8px;
  }
  .task-file-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--bg);
  }
  .task-file-item .file-icon{
    font-size:15px;
    flex-shrink:0;
  }
  .task-file-item .file-name{
    flex:1;
    min-width:0;
    font-size:12.5px;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .task-file-item .file-download{
    font-size:12px;
    font-weight:600;
    color:var(--teal-dark);
    text-decoration:none;
    flex-shrink:0;
  }
  .task-file-item .file-download:hover{ text-decoration:underline; }
  .task-file-item .remove-file-btn{
    width:18px;height:18px;
    border-radius:50%;
    border:none;
    background:var(--coral);
    color:#fff;
    font-size:12px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .field-label{
    font-size:11.5px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:6px;
  }
  .fixed-task{
    font-size:14.5px;
    font-weight:600;
    color:var(--indigo);
    padding:2px 0;
  }
  select, .note-input{
    font-family:'Inter',sans-serif;
    font-size:14px;
    color:var(--ink);
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:9px 11px;
    background:var(--bg);
    width:100%;
    outline:none;
  }
  select:focus,.note-input:focus{border-color:var(--teal);}
  .timer-box{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .timer-display{
    font-family:'Inter',sans-serif;
    font-variant-numeric:tabular-nums;
    font-size:17px;
    font-weight:700;
    color:var(--indigo);
    min-width:52px;
  }
  .timer-display.running{color:var(--coral);}
  .timer-btn{
    width:32px;height:32px;
    border-radius:8px;
    border:1.5px solid var(--line);
    background:var(--white);
    cursor:pointer;
    font-size:13px;
    display:flex;align-items:center;justify-content:center;
    color:var(--teal-dark);
  }
  .timer-btn:hover{background:var(--teal-tint);}
  .checkbox-wrap{display:flex;justify-content:flex-start;}
  .checkbox-wrap input[type=checkbox]{
    width:20px;height:20px;
    accent-color:var(--teal);
    cursor:pointer;
  }

  .planner-footer{
    margin-top:22px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12.5px;
    color:var(--muted);
  }
</style>
</head>
<body>

<div class="petal-stripe"></div>

<!-- ================= LOGIN ================= -->

  // ---------- storage (falls back to in-memory if localStorage is blocked) ----------
  var memStore = {};
  var storageOK = (function(){
    try{
      localStorage.setItem("__uwon_test__","1");
      localStorage.removeItem("__uwon_test__");
      return true;
    }catch(e){ return false; }
  })();
  function storeGet(key){
    if(storageOK){ try{ return localStorage.getItem(key); }catch(e){} }
    return Object.prototype.hasOwnProperty.call(memStore,key) ? memStore[key] : null;
  }
  function storeSet(key,val){
    if(storageOK){ try{ localStorage.setItem(key,val); return; }catch(e){} }
    memStore[key]=val;
  }
  function storeRemove(key){
    if(storageOK){ try{ localStorage.removeItem(key); }catch(e){} }
    delete memStore[key];
  }

  // ---------- helpers ----------
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function fmt(sec){ sec = Math.max(0, sec|0); return pad(Math.floor(sec/60)) + ":" + pad(sec%60); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }
  function todayDisplay(){
    var d = new Date();
    var weekdays = ["周日","周一","周二","周三","周四","周五","周六"];

  // ---------- plan storage (per user, per day, per module; cleared when "完成" is clicked) ----------
  // Stored in a "plans" table in 腾讯云开发 CloudBase (PostgreSQL) so the same student's plan is visible from any device.
  function planRowId(){
    // Cached id of the matching row once we've seen it, so savePlan can update instead of insert.
    return planRowId._id;
  }

  function defaultRow(){
    return { minutes:0, task:"", subOption:"", detailText:"", customText:"", subjectText:"", dueDate:"", taskFiles:[], remaining:0, running:false, done:false, note:"", noteImages:[] };
  }

  function freshPlan(){
    var rows = [];
    for(var i=0;i<ROW_COUNT;i++) rows.push(defaultRow());
    return rows;
  }

  function normalizePlanRows(rows){
    if(!rows || rows.length < 1){ rows = freshPlan(); }
    rows.forEach(function(r){
      r.running = false; // never resume auto-running after reload
      if(!r.noteImages){ r.noteImages = []; }
      if(typeof r.subOption !== "string"){ r.subOption = ""; }
      if(typeof r.detailText !== "string"){ r.detailText = ""; }
      if(typeof r.customText !== "string"){ r.customText = ""; }
      if(typeof r.subjectText !== "string"){ r.subjectText = ""; }
      if(typeof r.dueDate !== "string"){ r.dueDate = ""; }
      if(!r.taskFiles){ r.taskFiles = []; }
    });
    return rows;
  }

  // Returns a Promise resolving to the plan rows for the current user/mode/day.
  function loadPlan(){
    var myMode = currentMode, myUser = currentUser(), myDate = todayStr();
    return cbAuthReady.then(function(){
      return cbDb.from("plans")
        .select("id,data")
        .eq("mode", myMode)
        .eq("student", myUser)
        .eq("date", myDate);
    }).then(function(res){
      if(res.error) throw res.error;
      var row = (res.data && res.data.length) ? res.data[0] : null;
      planRowId._id = row ? row.id : null;
      return normalizePlanRows(row ? row.data : null);
    });
  }

  var planState = [];
  var saveGeneration = 0;

  function savePlan(){
    var ind = document.getElementById("save-indicator");
    ind.textContent = "正在保存…";
    var myGen = ++saveGeneration;
    var myMode = currentMode, myUser = currentUser(), myDate = todayStr();
    var payload = { mode: myMode, student: myUser, date: myDate, data: planState };

    var req = planRowId()
      ? cbDb.from("plans").update({ data: planState }).eq("id", planRowId())
      : cbDb.from("plans").insert(payload).select("id");

    req.then(function(res){
      if(res.error) throw res.error;
      if(!planRowId() && res.data && res.data.length){
        planRowId._id = res.data[0].id; // remember the new row's id for future saves
      }
      if(myGen !== saveGeneration) return; // a newer save already superseded this one
      ind.textContent = "已自动保存";
      clearTimeout(ind._t);
      ind._t = setTimeout(function(){ ind.textContent = ""; }, 1400);
    }).catch(function(err){
      if(myGen !== saveGeneration) return;
      ind.textContent = "保存失败，请检查网络";
      console.error("savePlan failed:", err);
    });
  }

  function taskOptionsHtml(row){

    });

    }
    return html;
  }

  function subOptionsHtml(list, selected, placeholder){
    var html = "";
    list.forEach(function(s){
      html += '<option value="'+escapeHtml(s)+'"'+(selected===s?" selected":"")+'>'+escapeHtml(s)+'</option>';
    });
    if(!selected){

    }
    return html;
  }

  function noteImagesHtml(row){

                '<img src="'+src+'">' +

              '</div>';

  function fileIcon(name){
    var ext = (name.split(".").pop() || "").toLowerCase();
    if(ext === "pdf") return "📕";
    if(ext === "doc" || ext === "docx") return "📘";
    if(ext === "xls" || ext === "xlsx") return "📗";
    if(ext === "ppt" || ext === "pptx") return "📙";
    return "📄";
  }

  function taskFilesHtml(row){
    if(!row.taskFiles || row.taskFiles.length === 0) return "";
    var html = '<div class="task-files-list">';
    row.taskFiles.forEach(function(f, fIdx){

              '</div>';
    });

    return html;

  function readFileAsDataUrl(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){ resolve({ name: file.name, dataUrl: e.target.result }); };
      reader.onerror = function(){ reject(new Error("file read failed")); };
      reader.readAsDataURL(file);
    });
  }

            '<input class="note-input detail-text" type="text" placeholder="'+escapeHtml(cfg.detailPlaceholder||"填写具体内容")+'" style="margin-top:8px;" value="'+escapeHtml(row.detailText||"")+'">';

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function resizeImageFile(file, maxDim, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          var scale = Math.min(1, maxDim / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * scale));
          var ch = Math.max(1, Math.round(h * scale));
          var canvas = document.createElement("canvas");
          canvas.width = cw;
          canvas.height = ch;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, cw, ch);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = function(){ reject(new Error("image load failed")); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error("file read failed")); };
      reader.readAsDataURL(file);
    });
  }

  // ---------- events (delegated) ----------
  document.getElementById("plan-list").addEventListener("change", function(e){
    var card = e.target.closest(".plan-row");
    if(!card) return;
    var i = parseInt(card.dataset.idx, 10);
    var row = planState[i];

    if(e.target.classList.contains("min-select")){
      row.minutes = parseInt(e.target.value, 10);
      if(!row.running){ row.remaining = row.minutes * 60; renderRowTimer(i); }
      savePlan();
    }
    else if(e.target.classList.contains("task-select")){
      row.task = e.target.value;
      row.subOption = "";
      row.detailText = "";
      row.customText = "";
      row.subjectText = "";
      renderTbody();
      savePlan();
    }
    else if(e.target.classList.contains("sub-select")){
      row.subOption = e.target.value;
      savePlan();
    }
    else if(e.target.classList.contains("detail-text")){
      row.detailText = e.target.value;
      savePlan();
    }
    else if(e.target.classList.contains("subject-text")){
      row.subjectText = e.target.value;
      savePlan();
    }
    else if(e.target.classList.contains("custom-text")){
      row.customText = e.target.value;
      savePlan();
    }
    else if(e.target.classList.contains("due-date-input")){
      row.dueDate = e.target.value;
      savePlan();
    }
    else if(e.target.classList.contains("note-field")){
      row.note = e.target.value;
      savePlan();
    }
    else if(e.target.classList.contains("done-checkbox")){
      row.done = e.target.checked;
      if(row.done && row.running){ pauseTimer(i); }
      card.className = "plan-row" + (row.done ? " row-done" : "");
      savePlan();
    }
    else if(e.target.classList.contains("note-image-input")){
      var files = Array.prototype.slice.call(e.target.files || []);
      if(files.length === 0) return;
      Promise.all(files.map(function(f){ return resizeImageFile(f, 1440, 0.85); }))
        .then(function(dataUrls){
          row.noteImages = (row.noteImages || []).concat(dataUrls);
          renderTbody();
          savePlan();
        })
        .catch(function(){ /* ignore failed images */ });
    }
    else if(e.target.classList.contains("task-file-input")){
      var taskFiles = Array.prototype.slice.call(e.target.files || []);
      if(taskFiles.length === 0) return;
      Promise.all(taskFiles.map(readFileAsDataUrl))
        .then(function(files){
          row.taskFiles = (row.taskFiles || []).concat(files);
          renderTbody();
          savePlan();
        })
        .catch(function(){ /* ignore failed files */ });
    }
  });

  document.getElementById("plan-list").addEventListener("input", function(e){
    var card = e.target.closest(".plan-row");
    if(!card) return;
    var i = parseInt(card.dataset.idx, 10);
    var row = planState[i];
    if(e.target.classList.contains("detail-text")){ row.detailText = e.target.value; }
    else if(e.target.classList.contains("subject-text")){ row.subjectText = e.target.value; }
    else if(e.target.classList.contains("custom-text")){ row.customText = e.target.value; }
    else if(e.target.classList.contains("note-field")){ row.note = e.target.value; }
  });

  document.getElementById("plan-list").addEventListener("click", function(e){
    if(e.target.closest(".add-row-card")){
      planState.push(defaultRow());
      renderTbody();
      savePlan();
      return;
    }
    var card = e.target.closest(".plan-row");
    if(!card) return;
    var i = parseInt(card.dataset.idx, 10);

    if(e.target.classList.contains("start-pause-btn")){
      var row = planState[i];
      if(row.done) return;
      if(row.running){ pauseTimer(i); } else { startTimer(i); }
      savePlan();
    }
    else if(e.target.classList.contains("reset-btn")){
      resetTimer(i);
      savePlan();
    }
    else if(e.target.classList.contains("remove-image-btn")){
      var imgIdx = parseInt(e.target.dataset.imgIdx, 10);
      var r = planState[i];
      r.noteImages.splice(imgIdx, 1);
      renderTbody();
      savePlan();
    }
    else if(e.target.classList.contains("remove-file-btn")){
      var fileIdx = parseInt(e.target.dataset.fileIdx, 10);
      var rf = planState[i];
      rf.taskFiles.splice(fileIdx, 1);
      renderTbody();
      savePlan();
    }
  });

  // ---------- timer logic ----------
  function startTimer(i){
    var row = planState[i];
    if(row.minutes <= 0) return;
    if(row.remaining <= 0){ row.remaining = row.minutes * 60; }
    row.running = true;
    renderRowTimer(i);
    timers[i] = setInterval(function(){
      row.remaining--;
      if(row.remaining <= 0){
        row.remaining = 0;
        row.running = false;
        clearInterval(timers[i]);
        delete timers[i];
        savePlan();
      }
      renderRowTimer(i);
    }, 1000);
  }

  function pauseTimer(i){
    var row = planState[i];
    row.running = false;
    if(timers[i]){ clearInterval(timers[i]); delete timers[i]; }
    renderRowTimer(i);
  }

  function resetTimer(i){
    var row = planState[i];
    if(timers[i]){ clearInterval(timers[i]); delete timers[i]; }
    row.running = false;
    row.remaining = row.minutes * 60;
    renderRowTimer(i);
  }

  function stopAllTimers(){
    Object.keys(timers).forEach(function(k){ clearInterval(timers[k]); });
    timers = {};
  }

  function renderRowTimer(i){
    var tr = document.querySelector('.plan-row[data-idx="'+i+'"]');
    if(!tr) return;
    var row = planState[i];
    var disp = tr.querySelector(".timer-display");
    var btn = tr.querySelector(".start-pause-btn");
    disp.textContent = fmt(row.remaining);
    disp.className = "timer-display" + (row.running ? " running" : "");
    btn.textContent = row.running ? "⏸" : "▶";
  }

  // ---------- report ----------
  function rowDescription(i, row){
    if(i === 0 && !modeCfg().noFixedFirst){ return modeCfg().firstFixed; }
    var cfg = modeCfg().config[row.task];
    if(cfg && cfg.kind === "subject"){
      var subj = row.subOption ? ("（"+row.subOption+"）") : "";
      var detail = row.detailText ? "：" + row.detailText : "";
      return row.task + subj + detail;
    }
    if(cfg && cfg.kind === "subjectFree"){
      var subjFree = row.subjectText ? ("（"+row.subjectText+"）") : "";
      var detailFree = row.detailText ? "：" + row.detailText : "";
      return row.task + subjFree + detailFree;
    }
    if(cfg && cfg.kind === "custom"){
      return row.customText ? row.customText : row.task;
    }
    if(cfg && cfg.kind === "subselect"){
      return row.subOption ? row.task + "（" + row.subOption + "）" : row.task;
    }
    return row.task || "未选择任务";
  }

  function reportRowsData(){
    return planState.map(function(row, i){
      return {
        num: i+1,
        desc: rowDescription(i, row),
        minutes: row.minutes,
        done: row.done,
        note: row.note || "",
        noteImages: row.noteImages || [],
        dueDate: row.dueDate || ""
      };
    });
  }

  function formatDueDate(v){
    if(!v) return "";
    var parts = v.split("T");
    if(parts.length !== 2) return v;
    return parts[0] + " " + parts[1];
  }

  var currentReportText = "";

  function generateReportText(data, doneCount){
    var lines = [];
    lines.push("UWON 每日任务报告");
    lines.push("学生：" + currentUser());
    lines.push("模块：" + modeCfg().label);
    lines.push("日期：" + todayDisplay());
    lines.push("完成情况：已完成 " + doneCount + " 项任务");
    lines.push("");
    data.forEach(function(r){
      lines.push(r.num + ". " + r.desc + "　—　" + r.minutes + " 分钟　—　" + (r.done ? "已完成" : "未完成"));
      if(r.dueDate){ lines.push("　　截止：" + formatDueDate(r.dueDate)); }
      if(r.note){ lines.push("　　备注：" + r.note); }
      if(r.noteImages && r.noteImages.length){ lines.push("　　（附图 " + r.noteImages.length + " 张，长图中可见）"); }
    });
    return lines.join("\n");
  }

  function renderReportList(data){
    var list = document.getElementById("report-list");
    var html = "";
    data.forEach(function(r){
      var imagesHtml = "";
      if(r.noteImages && r.noteImages.length){
        imagesHtml = '<div class="report-item-images">';
        r.noteImages.forEach(function(src){
          imagesHtml += '<img src="'+src+'">';
        });
        imagesHtml += '</div>';
      }
      html +=
        '<div class="report-item '+(r.done?'done':'pending')+'">' +
          '<span class="item-num">'+r.num+'</span>' +
          '<div class="item-body">' +
            '<div class="item-title-row">' +
              '<span class="item-title">'+escapeHtml(r.desc)+'</span>' +
              '<span class="status-badge '+(r.done?'done':'pending')+'">'+(r.done?'已完成':'未完成')+'</span>' +
            '</div>' +
            '<div class="item-meta">'+r.minutes+' 分钟</div>' +
            (r.dueDate ? '<div class="item-meta">截止：'+escapeHtml(formatDueDate(r.dueDate))+'</div>' : '') +
            (r.note ? '<div class="item-note">备注：'+escapeHtml(r.note)+'</div>' : '') +
            imagesHtml +
          '</div>' +
        '</div>';
    });
    list.innerHTML = html;
  }

  var currentReportData = [];
  var currentReportDoneCount = 0;

  document.getElementById("finish-btn").addEventListener("click", function(){
    var data = reportRowsData();
    var doneCount = data.filter(function(r){ return r.done; }).length;
    document.getElementById("report-date").textContent = todayDisplay();
    document.getElementById("report-meta").innerHTML =
      '<span class="report-chip">学生：'+escapeHtml(currentUser())+'</span>' +
      '<span class="report-chip">模块：'+escapeHtml(modeCfg().label)+'</span>' +
      '<span class="report-chip">已完成 '+doneCount+' 项任务</span>';
    renderReportList(data);
    currentReportText = generateReportText(data, doneCount);
    currentReportData = data;
    currentReportDoneCount = doneCount;
    document.getElementById("report-image-wrap").innerHTML = "";

    // Once finished, this plan is done: clear it so the next visit to the planner starts blank.
    stopAllTimers();
    if(planRowId()){
      cbDb.from("plans").delete().eq("id", planRowId())
        .then(function(res){ if(res.error) console.error("clear plan failed:", res.error); })
        .catch(function(err){ console.error("clear plan failed:", err); });
      planRowId._id = null;
    }
    planState = freshPlan();
    renderTbody();

    show("screen-report");
  });

  // ---------- long-image generation ----------
  function loadImageAsync(src){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ reject(new Error("image load failed")); };
      img.src = src;
    });
  }

  function drawRoundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawImageCover(ctx, img, dx, dy, dw, dh, radius){
    var sw = img.width, sh = img.height;
    var scale = Math.max(dw/sw, dh/sh);
    var sx = (sw - dw/scale)/2;
    var sy = (sh - dh/scale)/2;
    ctx.save();
    drawRoundRect(ctx, dx, dy, dw, dh, radius);
    ctx.clip();
    ctx.drawImage(img, sx, sy, dw/scale, dh/scale, dx, dy, dw, dh);
    ctx.restore();
  }

  function wrapTextByChar(ctx, text, maxWidth){
    var chars = String(text).split("");
    var lines = [];
    var current = "";
    for(var i=0;i<chars.length;i++){
      var test = current + chars[i];
      if(current && ctx.measureText(test).width > maxWidth){
        lines.push(current);
        current = chars[i];
      } else {
        current = test;
      }
    }
    if(current){ lines.push(current); }
    return lines.length ? lines : [""];
  }

  function generateReportImage(data, doneCount){
    var W = 720;
    var PAD = 32;
    var contentW = W - PAD*2;
    var logoSrc = document.querySelector(".brand img").src;

    var allImgSrcs = [];
    data.forEach(function(r){ (r.noteImages||[]).forEach(function(s){ allImgSrcs.push(s); }); });

    return Promise.all([loadImageAsync(logoSrc)].concat(allImgSrcs.map(loadImageAsync)))
      .then(function(loaded){
        var logoImg = loaded[0];
        var imgMap = {};
        allImgSrcs.forEach(function(s, idx){ imgMap[s] = loaded[idx+1]; });

        var measureCanvas = document.createElement("canvas");
        var mctx = measureCanvas.getContext("2d");

        var itemTitleFont = '700 16px "Inter", sans-serif';
        var metaFont = '600 12px "Inter", sans-serif';
        var noteFont = '400 12.5px "Inter", sans-serif';

        var headerH = 66;
        var titleBlockH = 50;
        var chipsH = 40;
        var itemPad = 18;
        var itemGap = 14;
        var numCircle = 26;
        var textX0 = itemPad*2 + numCircle;
        var bodyMaxW = contentW - textX0 - itemPad - 70;
        var imgMaxW = contentW - textX0 - itemPad;
        var imgMaxH = 480;
        var imgGap = 10;

        function fitImageBox(img){
          var scale = Math.min(imgMaxW / img.width, imgMaxH / img.height);
          return { w: Math.round(img.width * scale), h: Math.round(img.height * scale) };
        }

        var itemLayouts = data.map(function(r){
          mctx.font = itemTitleFont;
          var titleLines = wrapTextByChar(mctx, r.desc, bodyMaxW);
          var h = itemPad + titleLines.length*22 + 22;
          var noteLines = [];
          if(r.note){
            mctx.font = noteFont;
            noteLines = wrapTextByChar(mctx, "备注：" + r.note, contentW - textX0 - itemPad);
            h += noteLines.length*18 + 6;
          }
          var imgSizes = [];
          if(r.noteImages && r.noteImages.length){
            r.noteImages.forEach(function(src){
              var img = imgMap[src];
              if(!img) return;
              var box = fitImageBox(img);
              imgSizes.push(box);
              h += box.h + imgGap;
            });
            h += 4;
          }
          h += itemPad;
          return { titleLines: titleLines, noteLines: noteLines, imgSizes: imgSizes, height: h };
        });

        var itemsTotalH = itemLayouts.reduce(function(sum, it){ return sum + it.height + itemGap; }, 0);
        var footerH = 40;
        var totalH = PAD + headerH + titleBlockH + chipsH + 12 + itemsTotalH + footerH + PAD;

        var SCALE = 2;
        var canvas = document.createElement("canvas");
        canvas.width = W * SCALE;
        canvas.height = totalH * SCALE;
        var ctx = canvas.getContext("2d");
        ctx.scale(SCALE, SCALE);
        ctx.imageSmoothingEnabled = true;
        if("imageSmoothingQuality" in ctx){ ctx.imageSmoothingQuality = "high"; }

        ctx.fillStyle = "#F7FAF9";
        ctx.fillRect(0, 0, W, totalH);

        var grad = ctx.createLinearGradient(0, 0, W, 0);
        grad.addColorStop(0, "#F2C94C");
        grad.addColorStop(0.26, "#E8702A");
        grad.addColorStop(0.68, "#2E6FB0");
        grad.addColorStop(1, "#223A63");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, 6);

        var cy = PAD;
        var logoH = 38;
        var logoW = logoImg.width * (logoH/logoImg.height);
        ctx.drawImage(logoImg, PAD, cy, logoW, logoH);
        ctx.fillStyle = "#223A63";
        ctx.font = '700 18px "Baloo 2", "Inter", sans-serif';
        ctx.textBaseline = "middle";
        ctx.fillText("督学系统", PAD + logoW + 14, cy + logoH/2 + 1);
        ctx.textBaseline = "alphabetic";
        cy += headerH;

        ctx.fillStyle = "#223A63";
        ctx.font = '700 26px "Baloo 2", "Inter", sans-serif';
        ctx.fillText("今日报告", PAD, cy + 22);
        ctx.fillStyle = "#6B7C82";
        ctx.font = metaFont;
        ctx.textAlign = "right";
        ctx.fillText(todayDisplay(), W-PAD, cy + 18);
        ctx.textAlign = "left";
        cy += titleBlockH;

        var chipTexts = ["学生：" + currentUser(), "模块：" + modeCfg().label, "已完成 " + doneCount + " 项任务"];
        var chipX = PAD;
        var chipFont = '700 12.5px "Inter", sans-serif';
        ctx.font = chipFont;
        chipTexts.forEach(function(t){
          var tw = ctx.measureText(t).width;
          var chipW = tw + 24;
          var chipHgt = 28;
          drawRoundRect(ctx, chipX, cy, chipW, chipHgt, chipHgt/2);
          ctx.fillStyle = "#E4F4EF";
          ctx.fill();
          ctx.fillStyle = "#0F6355";
          ctx.textBaseline = "middle";
          ctx.fillText(t, chipX+12, cy+chipHgt/2+1);
          chipX += chipW + 10;
        });
        ctx.textBaseline = "alphabetic";
        cy += chipsH + 12;

        data.forEach(function(r, idx){
          var layout = itemLayouts[idx];
          var itemY = cy;
          var itemH = layout.height;

          drawRoundRect(ctx, PAD, itemY, contentW, itemH, 14);
          ctx.fillStyle = "#FFFFFF";
          ctx.fill();
          ctx.strokeStyle = "#D8E6E1";
          ctx.lineWidth = 1;
          ctx.stroke();

          var circleX = PAD + itemPad + numCircle/2;
          var circleY = itemY + itemPad + numCircle/2;
          ctx.beginPath();
          ctx.arc(circleX, circleY, numCircle/2, 0, Math.PI*2);
          ctx.fillStyle = "#E4F4EF";
          ctx.fill();
          ctx.fillStyle = "#0F6355";
          ctx.font = '700 12px "Inter", sans-serif';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(String(r.num), circleX, circleY+1);
          ctx.textAlign = "left";
          ctx.textBaseline = "alphabetic";

          var textX = PAD + textX0;
          var titleTopY = itemY + itemPad + 14;
          ctx.fillStyle = "#16232E";
          ctx.font = itemTitleFont;
          layout.titleLines.forEach(function(line, li){
            ctx.fillText(line, textX, titleTopY + li*22);
          });
          var afterTitleY = titleTopY + layout.titleLines.length*22;

          var badgeText = r.done ? "已完成" : "未完成";
          ctx.font = '700 11px "Inter", sans-serif';
          var badgeW = ctx.measureText(badgeText).width + 20;
          var badgeH = 22;
          var badgeX = PAD + contentW - itemPad - badgeW;
          var badgeY = itemY + itemPad;
          drawRoundRect(ctx, badgeX, badgeY, badgeW, badgeH, badgeH/2);
          ctx.fillStyle = r.done ? "#E4F4EF" : "#F0F0EC";
          ctx.fill();
          ctx.fillStyle = r.done ? "#0F6355" : "#6B7C82";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(badgeText, badgeX+badgeW/2, badgeY+badgeH/2+1);
          ctx.textAlign = "left";
          ctx.textBaseline = "alphabetic";

          ctx.fillStyle = "#6B7C82";
          ctx.font = metaFont;
          var minY = afterTitleY + 16;
          ctx.fillText(r.minutes + " 分钟", textX, minY);

          var afterY = minY + 6;
          if(layout.noteLines.length){
            ctx.font = noteFont;
            ctx.fillStyle = "#6B7C82";
            layout.noteLines.forEach(function(line, li){
              ctx.fillText(line, textX, afterY + 14 + li*18);
            });
            afterY = afterY + 14 + layout.noteLines.length*18;
          }

          if(layout.imgSizes.length){
            var iy = afterY + 8;
            layout.imgSizes.forEach(function(box, ii){
              var src = r.noteImages[ii];
              var img = imgMap[src];
              if(!img) return;
              drawRoundRect(ctx, textX, iy, box.w, box.h, 12);
              ctx.save();
              ctx.clip();
              ctx.drawImage(img, textX, iy, box.w, box.h);
              ctx.restore();
              iy += box.h + imgGap;
            });
          }

          cy += itemH + itemGap;
        });

        ctx.fillStyle = "#6B7C82";
        ctx.font = metaFont;
        ctx.textAlign = "center";
        ctx.fillText("UWON Academy · uwonacademy.github.io", W/2, totalH - PAD/2);
        ctx.textAlign = "left";

        return canvas.toDataURL("image/png");
      });
  }

  function buildPrintReport(data, doneCount){
    var logoSrc = document.querySelector(".brand img").src;
    var html = "";
    html += '<div class="pr-stripe"></div>';
    html += '<div class="pr-header">' +
      '<div class="pr-brand"><img src="'+logoSrc+'" alt="UWON Academy"><span class="pr-brand-name">督学系统</span></div>' +
    '</div>';
    html += '<div class="pr-title-block">' +
      '<h1 class="pr-title">今日报告</h1>' +
      '<span class="pr-date">'+escapeHtml(todayDisplay())+'</span>' +
    '</div>';
    html += '<div class="pr-chips">' +
      '<span class="pr-chip">学生：'+escapeHtml(currentUser())+'</span>' +
      '<span class="pr-chip">模块：'+escapeHtml(modeCfg().label)+'</span>' +
      '<span class="pr-chip">已完成 '+doneCount+' 项任务</span>' +
    '</div>';
    html += '<div class="pr-list">';
    data.forEach(function(r){
      html += '<div class="pr-item">';
      html += '<div class="pr-item-head">' +
        '<span class="pr-item-num">'+r.num+'</span>' +
        '<span class="pr-item-title">'+escapeHtml(r.desc)+'</span>' +
        '<span class="pr-badge '+(r.done?'done':'pending')+'">'+(r.done?'已完成':'未完成')+'</span>' +
      '</div>';
      html += '<div class="pr-item-meta">'+r.minutes+' 分钟</div>';
      if(r.dueDate){
        html += '<div class="pr-item-meta">截止：'+escapeHtml(formatDueDate(r.dueDate))+'</div>';
      }
      if(r.note){
        html += '<div class="pr-item-note">备注：'+escapeHtml(r.note)+'</div>';
      }
      if(r.noteImages && r.noteImages.length){
        html += '<div class="pr-item-images">';
        r.noteImages.forEach(function(src){
          html += '<img src="'+src+'">';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="pr-footer">UWON Academy · uwonacademy.github.io</div>';
    return html;
  }

  document.getElementById("print-report-btn").addEventListener("click", function(){
    document.getElementById("print-report-root").innerHTML =
      buildPrintReport(currentReportData, currentReportDoneCount);
    window.print();
  });

  document.getElementById("copy-report-btn").addEventListener("click", function(){
    var ind = document.getElementById("copy-indicator");
    var wrap = document.getElementById("report-image-wrap");
    ind.textContent = "正在生成长图…";
    wrap.innerHTML = "";
    if(document.fonts && document.fonts.ready){ document.fonts.ready.catch(function(){}); }
    generateReportImage(currentReportData, currentReportDoneCount).then(function(dataUrl){
      ind.textContent = "长图已生成，可长按或右键保存图片";
      var img = document.createElement("img");
      img.src = dataUrl;
      img.style.maxWidth = "100%";
      img.style.borderRadius = "16px";
      img.style.border = "1px solid var(--line)";
      wrap.appendChild(img);
      try{
        var a = document.createElement("a");
        a.href = dataUrl;
        a.download = "UWON-report-" + todayStr() + ".png";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }catch(e){ /* download not supported, preview image above still works */ }
    }).catch(function(){
      ind.textContent = "生成失败，请重试";
    });
  });

  // ---------- boot ----------
  try{
    if(currentUser()){ enterDashboard(); } else { show("screen-login"); }
  }catch(err){
    var errEl0 = document.getElementById("login-error");
    if(errEl0) errEl0.textContent = "初始化出错：" + err.message;
  }

  window.addEventListener("error", function(e){
    var errEl1 = document.getElementById("login-error");
    if(errEl1 && !errEl1.textContent){ errEl1.textContent = "脚本错误：" + e.message; }
  });

})();
</script>
